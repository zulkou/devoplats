# Copy to <install-root>/configs/<app>/config.yml — per-app platform settings.
# App secrets belong in <install-root>/configs/<app>/.env (mode 600).

# Optional: pin this app to a Docker target. One host per entry; "local"
# forces the local daemon. Falls back to DOCKER_HOST_<ENV>, then DOCKER_HOST,
# then the local daemon.
#docker:
#  host: ssh://devoplats-remote
# or per environment:
#docker:
#  host:
#    dev: ssh://devoplats-dev
#    prod: ssh://devoplats-prod

healthcheck:
  # Host must be the app container; external URLs are rejected.
  url: http://${APP_SLUG}-${ENVIRONMENT}:80/
  expected_status: 200

migration:
  enabled: true
  automatic: true
  service: app
  command: ["php", "vendor/bin/phinx", "migrate"]
  # enabled: false
  # reason: "schema owned by another app's migration framework"

backup:
  # Opt-in and destructive. On automatic rollback after a migration attempt,
  # restore these databases from the pre-deploy backup. Writes made after the
  # backup are lost, and objects created by the failed migration may remain.
  restore_on_rollback: false
  databases:
    - engine: postgres
      service: postgres
      name: myapp_prod

test:
  enabled: true
  command: ["sh", "-c", "npm test"]
  # enabled: false
  # reason: "no test suite yet"
