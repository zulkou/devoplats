name: Development Deployment

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted

    concurrency:
      group: dev-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files
        run: |
          mkdir -p <apps-root>/${{ github.event.repository.name }}
          cp compose.yml <apps-root>/${{ github.event.repository.name }}/compose.yml

      - name: Deploy
        run: |
          <install-root>/bin/devops deploy \
            --app "${{ github.event.repository.name }}" \
            --tag "${{ inputs.image_tag }}" \
            --env dev
