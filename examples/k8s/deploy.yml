# App repo workflow for Kubernetes apps: .github/workflows/deploy.yml
#
# Builds the image, pins its immutable commit tag in the prod overlay, and
# commits that pin to main. Argo CD / Flux watches main and rolls out.
# The devoplats platform host is never called.
#
# Requires: Dockerfile at the repository root, k8s/overlays/prod/ in the repo,
# and a GitOps Application (see README.md).

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write   # pin commit
  packages: write   # GHCR push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SLUG=$(echo "${{ github.event.repository.name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "image=ghcr.io/${OWNER}/${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin:
    needs: build
    runs-on: ubuntu-latest
    # Serialise pin commits so rapid pushes cannot land out of order.
    concurrency:
      group: k8s-pin-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin image tag
        run: |
          sed -i -E "s#(newTag:[[:space:]]*).*#\1${{ github.sha }}#" \
            k8s/overlays/prod/kustomization.yaml
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          # [skip ci] prevents the pin commit from triggering this workflow again.
          git commit -am "deploy: ${{ github.sha }} [skip ci]"
          git push origin main
