[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devoplats"
version = "0.1.0"
description = "Self-hosted GitHub deployment platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
devoplats-webhook = "devoplats.webhook.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
